[package]
name = "axum_server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7.7", features = ["macros", "ws"] } 
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24.0"
bcrypt = "0.15.1"
rusqlite = { version = "0.32.1", features = ["bundled"] } 
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cookie = "0.18.1"
jsonwebtoken = "9.3.0"
chrono = "0.4.38"
headers = "0.4.0"
